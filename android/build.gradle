ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.6.1'
    androidxCoreVersion = project.hasProperty('androidxCoreVersion') ? rootProject.ext.androidxCoreVersion : '1.12.0'
    unifiedPushConnectorVersion = '3.3.5'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Only used when building this library on its own (CI, local checks).
        // When consumed by an app, the app's own Android Gradle Plugin is used.
        // CI overrides it with -PagpVersion=... to match the Capacitor version under test.
        classpath "com.android.tools.build:gradle:${project.findProperty('agpVersion') ?: '8.7.3'}"
    }
}

apply plugin: 'com.android.library'

android {
    namespace = "dev.capacitorunifiedpush"
    // -PciCompileSdk is only for building this library on its own against newer Capacitor versions.
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : (project.findProperty('ciCompileSdk') ?: '34').toInteger()
    defaultConfig {
        // Capacitor 6 needs 22, Capacitor 7 needs 23, Capacitor 8 needs 24.
        // The connector library itself supports API 16 and up.
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 22
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : (project.findProperty('ciCompileSdk') ?: '34').toInteger()
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lint {
        abortOnError = true
        warningsAsErrors = false
        // The Capacitor and androidx versions are chosen by the consuming app.
        disable 'GradleDependency', 'OldTargetApi', 'NewerVersionAvailable'
    }
    compileOptions {
        // Capacitor 6 builds with Java 17; newer Capacitor versions accept it too.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "org.unifiedpush.android:connector:$unifiedPushConnectorVersion"
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
